services:
  postgres:
    image: postgres:16-alpine
    container_name: talentx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentx
      POSTGRES_PASSWORD: talentx
      POSTGRES_DB: talentx
    ports:
      - '5432:5432'
    volumes:
      - talentx_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talentx -d talentx']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  talentx_pg_data:
