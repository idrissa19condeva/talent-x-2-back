name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talentx
          POSTGRES_PASSWORD: talentx
          POSTGRES_DB: talentx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentx -d talentx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://talentx:talentx@localhost:5432/talentx_test?schema=public
      CLERK_SECRET_KEY: sk_test_ci
      CLERK_PUBLISHABLE_KEY: pk_test_ci
      CLERK_WEBHOOK_SECRET: whsec_ci
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint --if-present
      - run: npm test -- --ci
      - run: npm run test:e2e -- --ci
